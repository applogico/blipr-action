version: 2
updates:
  # Workflow actions are CI-only, so they never cut a release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        update-types: [minor, patch]
